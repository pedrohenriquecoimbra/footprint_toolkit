[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxprint"
dynamic = ["version"]
description = "Flux footprint models for eddy covariance data analysis"
readme = "README.md"
authors = [
    { name = "Pedro Henrique Coimbra", email = "pedro-henrique.herig-coimbra@inrae.fr" },
]
keywords = ["footprint", "flux", "eddy covariance", "EC", "micrometeorology"]
license = "EUPL-1.2"
license-files = [
    "LICENSE",
    # The vendored Kljun et al. (2015) reference code's ISC-style license
    # requires its permission notice to accompany all copies.
    "fluxprint/model/Kljun_et_al_2015_original/license.txt",
]
requires-python = ">=3.10"
# Runtime requirements. `import fluxprint` itself is light (the geo/plotting
# stack loads lazily inside the functions that need it); the heavy libraries
# remain hard dependencies for 0.3 so existing installs keep working, and are
# planned to move into the extras below in a future release.
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "xarray",
    "netcdf4",
    "rasterio",
    "pyproj",
    "shapely",
    "fiona",
    "requests",
    "regorator>=0.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Other/Nonlisted Topic",
]

[project.optional-dependencies]
# The names below are what the package's ImportError hints advertise. Their
# packages are (still) also in `dependencies`; a future release will drop them
# there so a minimal install becomes possible - the extras are declared now so
# `pip install fluxprint[netcdf]` is valid today.
netcdf = ["xarray", "netcdf4"]
tiff = ["rasterio"]
crs = ["pyproj"]
shapefile = ["fiona", "shapely"]
viz = ["folium"]
all = ["xarray", "netcdf4", "rasterio", "pyproj", "fiona", "shapely", "folium"]
# rioxarray: the CF grid-mapping interop test. dask: the lazy map_footprints
# path (its test skips without it, so CI would silently not cover it).
dev = ["pytest", "rioxarray", "dask"]
icoscp = ["icoscp", "icoscp_core"]

[project.urls]
Homepage = "https://github.com/pedrohenriquecoimbra/fluxprint"
Issues = "https://github.com/pedrohenriquecoimbra/fluxprint/issues"

[tool.setuptools]
# `version` is read statically from the literal in fluxprint/version.py
packages.find = { where = ["."], include = ["fluxprint*"], exclude = ["sample*", "tests*"], namespaces = false }

[tool.setuptools.package-data]
# Ship the vendored reference code's license notice inside the package too.
"fluxprint.model.Kljun_et_al_2015_original" = ["license.txt"]

[tool.setuptools.dynamic]
version = { attr = "fluxprint.version.version" }

[tool.pytest.ini_options]
testpaths = ["tests"]
